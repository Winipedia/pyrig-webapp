---
"name": "pyrig-webapp"
"services":
  "app":
    "restart": "unless-stopped"
    "healthcheck":
      "test":
        - "CMD"
        - "python"
        - "-c"
        - |-
          from urllib.request import urlopen
          urlopen('http://localhost:3000/ping')
    "cap_drop":
      - "ALL"
    "security_opt":
      - "no-new-privileges:true"
  "web-server":
    "image": "docker.io/library/caddy:latest"
    "pull_policy": "always"
    "environment":
      "SITE_ADDRESS": "${SITE_ADDRESS:-localhost}"
    "ports":
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    "volumes":
      - "./caddy:/etc/caddy:ro"
      - "web-server-data:/data"
    "restart": "unless-stopped"
    "healthcheck":
      "test":
        - "CMD"
        - "curl"
        - "--fail"
        - "http://localhost:2019/config/"
    "cap_drop":
      - "ALL"
    "cap_add":
      - "NET_BIND_SERVICE"
    "security_opt":
      - "no-new-privileges:true"
"volumes":
  "web-server-data": {}
...
